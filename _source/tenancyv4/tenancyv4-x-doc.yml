categories:
- id: partnership
  title: Partnership endpoints in the identity and access management REST API for the NetApp Console
  permalink: partnership_overview.html
  ai-gen:
    lead: Use partnership endpoints to define and manage resource-sharing relationships
      between organizations. These endpoints establish permissions that enable users
      from one organization to access and manage designated resources in another organization.
    keywords: partnership collaboration,resource sharing,source organization,destination
      organization,access permissions,self-service
- id: resource and resourcegroup
  title: Resource and resourcegroup endpoints in the identity and access management REST API for the NetApp Console
  permalink: resource_and_resourcegroup_overview.html
  ai-gen:
    lead: Manage identity and access management (IAM) resources, resource types, and
      resource groups to organize and control access to working environments and associated
      assets within your organization. Use these endpoints to classify resources,
      handle telemetry-discovered assets, and group resources for streamlined management
      across implicit and explicit hierarchies.
    keywords: resource management,resource groups,identity access,resource types,implicit
      groups,explicit groups
- id: permission
  title: Permission endpoints in the identity and access management REST API for the NetApp Console
  permalink: permission_overview.html
  ai-gen:
    lead: Access permission endpoints to review and manage the low-level authorization
      strings that determine user or service account actions within NetApp Console
      IAM. Use these endpoints to define permissions across organizational resources,
      folders, and projects, ensuring precise control over access at various levels
      of the hierarchy.
    keywords: permissions management,identity access,resource hierarchy,authorization
      permissions,user permissions
- id: role
  title: Role endpoints in the identity and access management REST API for the NetApp Console
  permalink: role_overview.html
  ai-gen:
    lead: Use role endpoints to create and view roles that define sets of permissions
      in the NetApp Console identity and access management system. Roles determine
      the actions users can perform and their level of access within the resource
      hierarchy.
    keywords: roles management,identity management,access permissions,user roles,resource
      hierarchy
- id: hierarchy
  title: Hierarchy endpoints in the identity and access management REST API for the NetApp Console
  permalink: hierarchy_overview.html
  ai-gen:
    lead: Use hierarchy endpoints to model your organization's resource structure
      with organizations, folders, and projects. These elements help you define relationships
      and group resources logically for streamlined identity and access management
      in the NetApp Console.
    keywords: hierarchy management,resource hierarchy,organization hierarchy,folders
      management,projects management,resource association
- id: user and usergroup
  title: User and usergroup endpoints in the identity and access management REST API for the NetApp Console
  permalink: user_and_usergroup_overview.html
  ai-gen:
    lead: Manage users and user groups within NetApp Console identity and access management
      (IAM) to control access to resources. Use these endpoints to define individual
      users or service accounts and organize them into implicit or explicit user groups
      based on resource hierarchy or organizational structure.
    keywords: user management,user groups,identity management,access control,resource
      hierarchy,implicit groups
root_overview:
  ai-gen:
    keywords: identity and access management,iam,roles,permissions,organization hierarchy,user groups
    lead: Manage and control access to NetApp Console resources with the identity and access management (IAM) service. The endpoints cover hierarchy, permissions, partnerships, resources and resource groups, roles, and users and user groups.
