categories:
- id: domain
  title: Domain endpoints in the Federation REST API for the NetApp Console
  permalink: domain_overview.html
  ai-gen:
    lead: Verify ownership of domain names using the domain endpoints. Use these endpoints
      to manage domains that differ from your user's email address, including listing,
      creating, deleting, retrieving, and updating domain records.
    keywords: domain verification,verify domain,domain ownership,manage domains,update
      domain,delete domain
- id: federation
  title: Federation endpoints in the Federation REST API for the NetApp Console
  permalink: federation_overview.html
  ai-gen:
    lead: Use federation endpoints to create, retrieve, update, list, and delete federation
      connections with identity providers. These endpoints support identity federation
      management through the NetApp Console, replacing earlier functionality from
      Cloud Central Federation Setup.
    keywords: federation connections,identity providers,netapp console,federation
      management,cloud central federation
- id: unmigrated connection
  title: Unmigrated connection endpoints in the Federation REST API for the NetApp Console
  permalink: unmigrated_connection_overview.html
  ai-gen:
    lead: Use unmigrated connection endpoints to import connections from Cloud Central
      into the NetApp Console. Once imported, these connections are managed exclusively
      within the NetApp Console.
    keywords: unmigrated connections,import connections,cloud central,netapp console,federation
      setup
root_overview:
  ai-gen:
    keywords: identity federation,single sign-on,identity provider,domain verification,federation,unmigrated connections
    lead: Manage identity federation between the NetApp Console and your identity provider so that your corporate users can sign in with their existing credentials. Use the endpoints to manage domains, federations, and unmigrated connections.
