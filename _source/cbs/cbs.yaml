  /account/{accountId}/providers/cloudmanager_cbs/api/v3/backup/working-environment/{workingEnvironmentId}/volume/{volumeId}:
    post:
      description: |-
        Enables backup for a specified volume (version V3). This version
        of the endpoint runs the job asynchronously. Backup is not allowed
        for a volume enabled with a SnapLock license (WORM license). You can
        configure the different backup modes. The AD_HOC mode creates an
        on-demand snapshot and stores a backup on the respective cloud.
        SCHEDULED mode (default mode) creates snapshots according to the ONTAP
        snapshot policy and stores a backup on the cloud according to the backup
        policy. Based on the defined backup policy, this API endpoint creates a
        SnapMirror to cloud relationship with a specific cloud object storage
        system. You can use this endpoint to set the archive after days
        parameter to move the volume data to the archive tier and also enable the
        object lock and ransomware detection feature on the volume.

        **Token usage:** NetApp Console user token.

        Note: NetApp recommends that you use this endpoint for on-demand
        (AD_HOC) backups of a volume. To enable backup on volumes, including for
        multi-bucket or per-volume object storage configurations, use the [v2
        panoramic protection API](https://docs.netapp.com/us-en/console-automation/cbs/post-account-providers-cloudmanager_cbs-api-v2-panoramic-protection-working-environment-volume.html).
      tags:
        - Backup
      parameters:
        - description: Account ID
          required: true
          in: path
          name: accountId
          schema:
            type: string
        - description: System ID
          required: true
          in: path
          name: workingEnvironmentId
          schema:
            type: string
        - description: Volume ID
          required: true
          in: path
          name: volumeId
          schema:
            type: string
        - description: User token
          required: true
          in: header
          name: authorization
          schema:
            type: string
        - description: Request identifier
          required: true
          in: header
          name: X-Agent-Id
          schema:
            type: string
      responses:
        '202':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                description: Default response
                properties:
                  job-id:
                    type: string
      x-scope: private,public,ncl,nco,documentation
      requestBody:
        required: false
