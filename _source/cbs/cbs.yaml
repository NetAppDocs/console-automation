paths:
  /account/{accountId}/providers/cloudmanager_cbs/api/v1/sfr/working-environment/{workingEnvironmentId}/volume/{volumeId}/file-explore/start:
    post:
      description: |-
        Starts a file and folder explore operation while initiating a single file restore (SFR) operation. It initiates the deployment of an Active Data Connector container on the Console agent and mounts the snapshot under the `/opt/application/netapp` folder to browse the files and folders. This API endpoint is currently supported on Cloud Volumes ONTAP on AWS, Azure, Google Cloud, and on-premises ONTAP systems. It supports retrieving files and folders from backups stored on AWS, Azure, Google Cloud, and StorageGRID cloud storage providers.

        **Token usage:**NetApp Console user token.
      tags:
        - SFR
      parameters:
        - description: Location of the snapshot
          required: false
          in: query
          name: snapshotLocation
          schema:
            type: string
            enum:
              - LOCAL
              - CLOUD
        - description: Snapshot ID of the source snapshot
          required: false
          in: query
          name: snapshotId
          schema:
            type: string
        - description: Account ID
          required: true
          in: path
          name: accountId
          schema:
            type: string
        - description: System ID
          required: true
          in: path
          name: workingEnvironmentId
          schema:
            type: string
        - description: File system or volume ID
          required: true
          in: path
          name: volumeId
          schema:
            type: string
        - description: User token
          required: true
          in: header
          name: authorization
          schema:
            type: string
        - description: Request identifier
          required: true
          in: header
          name: X-Agent-Id
          schema:
            type: string
      responses:
        '202':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                description: Default response
                properties:
                  job-id:
                    type: string
      x-scope: private,public,ncl,nco,documentation
      summary: Starts a file and folder explore operation while initiating a single file restore (SFR) operation.
