  /account/{accountId}/providers/cloudmanager_cbs/api/v1/panoramic-protection/working-environment/{workingEnvironmentId}/volume:
    post:
      description: |-
        Enables comprehensive panoramic protection for multiple
        volumes. Based on whether the backup workflow is cascading or fan-out, the API creates a replication relationship with a volume in the secondary
        cluster and then creates a backup to cloud relationship with a cloud or
        StorageGRID object store. While setting up the replication relationship,
        the API verifies whether a cluster peering relationship is set up
        between primary and secondary clusters. If there is no relationship, it creates a cluster
        peering relationship, SVM peering, and a DP volume on the
        secondary cluster. After the replication setup is complete, the API
        performs a SnapMirror create and initialize operation. When creating a
        backup to cloud relationship, it first creates a bucket to which the backup is
        transferred, and then a SnapMirror Cloud relationship is created and
        initialized. 

        **Token usage:** NetApp Console user
        token.

        Note: For new multi-bucket or per-volume
        object storage integrations, use the [v2
        panoramic protection API to
        enable backup on volumes](https://docs.netapp.com/us-en/console-automation/cbs/post-account-providers-cloudmanager_cbs-api-v2-panoramic-protection-working-environment-volume.html).
      tags:
        - Panoramic Protection
      parameters:
        - description: Account ID
          required: true
          in: path
          name: accountId
          schema:
            type: string
        - description: System ID
          required: true
          in: path
