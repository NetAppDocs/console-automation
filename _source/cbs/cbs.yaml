    put:
      description: |-
        Modifies comprehensive protection for multiple volumes. If the
        selected volume already has an existing replication relationship, you
        can use the API to modify the replication policy. Otherwise, the API can
        be used to create a replication relationship. It creates a cluster
        peering relationship, SVM peering, and a DP volume, and then performs a SnapMirror update and initialize operation.
        Similarly, if the selected volume already has an existing backup to
        cloud relationship, the API enables you to modify the backup policy.
        Alternatively, if there is no existing relationship, the API can be used
        to create a SnapMirror Cloud relationship. It creates a bucket in
        the specified cloud provider and then perform a SnapMirror Cloud
        update and initialize operation.

        **Token usage:** NetApp Console
        user token.

