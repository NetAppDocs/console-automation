categories:
- id: sfr
  title: Single file restore endpoints in the NetApp Backup and Recovery REST API
  permalink: sfr_overview.html
  ai-gen:
    lead: Restore individual files from volume snapshots using single file restore
      (SFR) endpoints. Use these endpoints to explore snapshot backups and retrieve
      files during recovery operations.
    keywords: single file restore,volume snapshots,snapshot backup,file explore,snapshot
      restore
- id: backup
  title: Backup endpoints in the NetApp Backup and Recovery REST API
  permalink: backup_overview.html
  ai-gen:
    lead: Use backup endpoints to manage backup operations for cloud and on-premises
      resources and retrieve details about backup data. These endpoints help you configure,
      modify, and disable backups for systems and volumes, as well as create on-demand
      backups when needed.
    keywords: backup operations,cloud backup,backup data,backup configuration,delete
      backups,on-demand backups
- id: restore
  title: Restore endpoints in the NetApp Backup and Recovery REST API
  permalink: restore_overview.html
  ai-gen:
    lead: Use the restore endpoints to recover volumes, folders, and files to their
      previous states. You can also check the status of ongoing restore operations
      to monitor progress and ensure successful recovery.
    keywords: restore operations,volume restore,folder restore,file restore,restore
      status
- id: system
  title: System endpoints in the NetApp Backup and Recovery REST API
  permalink: system_overview.html
  ai-gen:
    lead: Use system endpoints to retrieve system details, configure backup policies,
      and manage object stores associated with systems. These endpoints also support
      operations such as listing directories, modifying policies, and accessing information
      about storage resources and relationships.
    keywords: systems management,backup policies,object store,volume directories,snapmirror
      relationships
- id: cloud
  title: Cloud endpoints in the NetApp Backup and Recovery REST API
  permalink: cloud_overview.html
  ai-gen:
    lead: Retrieve information about cloud resources across AWS, Azure, and Google
      Cloud using these endpoints in the NetApp Backup and Recovery REST API. Use
      them to access details like accounts, region keys, storage classes, subscription
      settings, and project configurations, or to create Azure subscription resource-groups.
    keywords: cloud endpoints,backup recovery,aws resources,azure subscription,google
      cloud projects,netapp console
- id: job
  title: Job endpoints in the NetApp Backup and Recovery REST API
  permalink: job_overview.html
  ai-gen:
    lead: Access information about jobs executed within the NetApp Console SaaS application
      using these endpoints. Retrieve comprehensive details and listings to monitor
      and review backup and recovery activities.
    keywords: job details,netapp console,backup recovery,jobs list,saas application
- id: catalog
  title: Catalog endpoints in the NetApp Backup and Recovery REST API
  permalink: catalog_overview.html
  ai-gen:
    lead: Use catalog endpoints to manage indexed catalog searches for files based
      on specific queries. These endpoints support operations such as initiating searches,
      retrieving snapshot lists for volumes, and configuring or modifying catalog
      services across various environments, including cloud and on-premises deployments.
    keywords: catalog search,indexed catalog,volume snapshots,catalog service,dark
      sites,cloud catalog
- id: license
  title: License endpoints in the NetApp Backup and Recovery REST API
  permalink: license_overview.html
  ai-gen:
    lead: Use license endpoints to check the validity and eligibility of system licenses
      required for NetApp Backup and Recovery operations. These endpoints help you
      verify activation status, create backups, restore data, and monitor trial license
      durations.
    keywords: license validity,license eligibility,trial license,backup activation,restore
      backup
- id: ransomware scan
  title: Ransomware scan endpoints in the NetApp Backup and Recovery REST API
  permalink: ransomware_scan_overview.html
  ai-gen:
    lead: Initiate ransomware scans on cloud backup snapshots stored in object-store
      buckets to detect potential threats. These endpoints focus exclusively on scanning
      cloud backups and do not support local snapshots.
    keywords: ransomware scan,cloud backups,snapshot scan,ransomware detection,object
      store
- id: panoramic protection
  title: Panoramic protection endpoints in the NetApp Backup and Recovery REST API
  permalink: panoramic_protection_overview.html
  ai-gen:
    lead: Automate comprehensive 3-2-1 backup workflows to streamline data protection
      using Panoramic Protection endpoints. Use these endpoints to configure, modify,
      and manage cascading or fan-out topologies for replication and cloud backups
      across your systems and volumes.
    keywords: backup spectrum,3-2-1 model,volume replication,cloud backup,cascading
      topology,fan-out topology
- id: replication
  title: Replication endpoints in the NetApp Backup and Recovery REST API
  permalink: replication_overview.html
  ai-gen:
    lead: Manage SnapMirror replication relationships for volumes, including actions
      such as update, delete, pause, resync, reverse-resync, abort, and resume, to
      maintain data consistency and recovery readiness.
    keywords: snapmirror replication,volume replication,replication update,relationship
      resync,replicated volume
- id: report
  title: Report endpoints in the NetApp Backup and Recovery REST API
  permalink: report_overview.html
  ai-gen:
    lead: Generate and access inventory reports to track account-wide resources, specific
      systems, or storage VMs within a system. Use these endpoints to create detailed
      summaries or retrieve existing reports for analysis.
    keywords: inventory report,account inventory,storage vm report,system inventory,generate
      report,retrieve report
- id: storagegrid
  title: StorageGRID endpoints in the NetApp Backup and Recovery REST API
  permalink: storagegrid_overview.html
  ai-gen:
    lead: Use StorageGRID endpoints to access server version information, retrieve
      server details, and discover or add StorageGRID WebScale servers in your environment.
    keywords: storagegrid server,storagegrid version,storagegrid details,storagegrid
      discovery,netapp console
root_overview:
  ai-gen:
    keywords: backup and recovery,data backup,restore,archiving,cloud volumes ontap,ransomware scan
    lead: Automate backup, restore, and long-term archiving of data from Cloud Volumes ONTAP and on-premises ONTAP clusters. The endpoints cover components such as backups, restores, catalogs, ransomware scans, and replication.
